<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Working Capital Credit Lifecycle</title>
  <style>
    :root { --bg:#0b1220; --panel:#131c2f; --line:#2d3a56; --text:#e7edf8; --muted:#a8b4cc; --gold:#e6bf66; --ok:#22c55e; --warn:#f59e0b; }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#233255,#0a111f 42%);color:var(--text)}
    .app{max-width:1200px;margin:0 auto;padding:20px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--muted)}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
    .kpi{background:#0f1729;border:1px solid var(--line);padding:12px;border-radius:12px}
    .kpi .v{font-size:1.2rem;font-weight:700;color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    .chip{background:#0f1729;border:1px solid var(--line);padding:10px;border-radius:10px}
    .chip small{display:block;color:var(--muted)}
    .stages{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:8px;overflow:auto}
    .stage{border:1px solid var(--line);padding:10px;border-radius:10px;background:#0f1729;min-height:72px}
    .done{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.12)}
    .active{border-color:rgba(245,158,11,.65);background:rgba(245,158,11,.14)}
    .badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
    .low{background:rgba(34,197,94,.2);color:#86efac}.medium{background:rgba(245,158,11,.2);color:#fcd34d}.high{background:rgba(239,68,68,.2);color:#fca5a5}
    table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #24324e;text-align:left;font-size:13px}th{color:var(--muted)}
    button,select{font:inherit;background:#17233a;color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:10px}
    .fallback-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .fallback-card{background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:14px;max-width:460px;text-align:center}
  </style>
</head>
<body>
  <div id="app" class="app"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const STORAGE_KEY = "wc-lifecycle-single-html-v1";
      const STAGES = ["Origination", "Credit Appraisal", "Sanction", "Facility Setup", "Monitoring"];

      const defaultCustomer = () => ({
        id: "demo-1",
        name: "Apex Textiles Pvt Ltd",
        gstNumber: "27AAECA1234F1Z5",
        bankName: "Axis Bank",
        industry: "Textiles",
        contactNumber: "+91 9898989898",
        loanAccountNumber: "WC-AXIS-000182",
        lifecycleIndex: 3,
        riskRating: "Medium",
        facilities: [
          { type: "Cash Credit", sanctioned: 5000000, utilized: 4300000, roi: 10.25, renewalInDays: 28 },
          { type: "Bank Guarantee", sanctioned: 2200000, utilized: 1600000, roi: 3.2, renewalInDays: 68 }
        ]
      });

      const state = {
        customers: [],
        selectedId: "",
      };

      const appEl = document.getElementById("app");
      if (!appEl) {
        console.log("Critical failure: root #app element missing");
        return;
      }

      function toNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      }

      function money(v) {
        return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(toNumber(v));
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ customers: state.customers, selectedId: state.selectedId }));
        } catch (e) {
          console.log("State save failed:", e);
        }
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.customers)) return false;
          state.customers = parsed.customers;
          state.selectedId = parsed.selectedId || "";
          return true;
        } catch (e) {
          console.log("State load failed:", e);
          return false;
        }
      }

      function ensureDemoState() {
        if (!Array.isArray(state.customers) || state.customers.length === 0) {
          console.log("Critical state missing: initializing default demo customer");
          state.customers = [defaultCustomer()];
        }
        const exists = state.customers.some(c => c && c.id === state.selectedId);
        if (!exists) state.selectedId = state.customers[0] && state.customers[0].id ? state.customers[0].id : "demo-1";
      }

      function activeCustomer() {
        return state.customers.find(c => c && c.id === state.selectedId) || state.customers[0] || null;
      }

      function riskClass(risk) {
        const v = String(risk || "low").toLowerCase();
        if (v.includes("high")) return "high";
        if (v.includes("med")) return "medium";
        return "low";
      }

      function renderFallback() {
        appEl.innerHTML = '<div class="fallback-wrap"><div class="fallback-card"><h2>System Initialized – Demo Mode Active</h2><p class="muted">Fallback rendering engaged. The platform is running with safe demo defaults.</p></div></div>';
      }

      function render() {
        if (!appEl) return;
        ensureDemoState();
        const c = activeCustomer();
        if (!c) {
          renderFallback();
          return;
        }

        const facilities = Array.isArray(c.facilities) ? c.facilities : [];
        const exposure = facilities.reduce((s, f) => s + toNumber(f.sanctioned), 0);
        const utilized = facilities.reduce((s, f) => s + toNumber(f.utilized), 0);
        const utilization = exposure > 0 ? ((utilized / exposure) * 100).toFixed(1) : "0.0";

        appEl.innerHTML = `
          <div class="panel">
            <div class="row">
              <div>
                <h1>Working Capital Credit Lifecycle</h1>
                <div class="muted">Dashboard + Lifecycle Monitoring</div>
              </div>
              <div class="row">
                <label class="muted">Customer
                  <select id="customerSelect">${state.customers.map(x => `<option value="${x.id}" ${x.id === c.id ? "selected" : ""}>${x.name || "Unknown"}</option>`).join("")}</select>
                </label>
                <button id="nextStageBtn">Advance Stage</button>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="row">
              <h3>${c.name || "Demo Customer"}</h3>
              <span class="badge ${riskClass(c.riskRating)}">${c.riskRating || "Low"} Risk</span>
            </div>
            <div class="grid" style="margin-top:10px">
              <div class="chip"><small>GST Number</small>${c.gstNumber || "NA"}</div>
              <div class="chip"><small>Bank Name</small>${c.bankName || "NA"}</div>
              <div class="chip"><small>Industry</small>${c.industry || "NA"}</div>
              <div class="chip"><small>Contact</small>${c.contactNumber || "NA"}</div>
              <div class="chip"><small>Loan Account</small>${c.loanAccountNumber || "NA"}</div>
            </div>
          </div>

          <div class="panel">
            <h3>Dashboard</h3>
            <div class="kpis" style="margin-top:10px">
              <div class="kpi"><div class="v">${money(exposure)}</div><div class="muted">Total Sanctioned Exposure</div></div>
              <div class="kpi"><div class="v">${money(utilized)}</div><div class="muted">Total Utilized Amount</div></div>
              <div class="kpi"><div class="v">${utilization}%</div><div class="muted">Portfolio Utilization</div></div>
              <div class="kpi"><div class="v">${facilities.length}</div><div class="muted">Active Facilities</div></div>
            </div>
          </div>

          <div class="panel">
            <h3>Lifecycle Flow</h3>
            <div class="stages" style="margin-top:10px">
              ${STAGES.map((s, i) => `<div class="stage ${i < toNumber(c.lifecycleIndex) ? "done" : i === toNumber(c.lifecycleIndex) ? "active" : ""}"><small>${i < toNumber(c.lifecycleIndex) ? "Completed" : i === toNumber(c.lifecycleIndex) ? "In Progress" : "Pending"}</small><div><b>${s}</b></div></div>`).join("")}
            </div>
          </div>

          <div class="panel">
            <h3>Facility Snapshot</h3>
            <table>
              <thead><tr><th>Facility</th><th>Sanctioned</th><th>Utilized</th><th>ROI</th><th>Renewal (Days)</th></tr></thead>
              <tbody>
                ${facilities.length ? facilities.map(f => `<tr><td>${f.type || "NA"}</td><td>${money(f.sanctioned)}</td><td>${money(f.utilized)}</td><td>${toNumber(f.roi).toFixed(2)}%</td><td>${toNumber(f.renewalInDays)}</td></tr>`).join("") : '<tr><td colspan="5">No facilities found.</td></tr>'}
              </tbody>
            </table>
          </div>`;

        const selectEl = document.getElementById("customerSelect");
        const nextStageBtn = document.getElementById("nextStageBtn");

        if (selectEl) {
          selectEl.addEventListener("change", function(e) {
            state.selectedId = e.target && e.target.value ? e.target.value : state.selectedId;
            save();
            render();
          });
        }

        if (nextStageBtn) {
          nextStageBtn.addEventListener("click", function() {
            const current = activeCustomer();
            if (!current) return;
            current.lifecycleIndex = Math.min(STAGES.length - 1, toNumber(current.lifecycleIndex) + 1);
            save();
            render();
          });
        }
      }

      try {
        load();
        ensureDemoState();
        save();
        render();
      } catch (error) {
        console.log("Initialization error:", error);
        renderFallback();
      }
    });
  </script>
</body>
</html>
